name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish as a release (e.g. v1.1.0). Empty = build only.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Mover.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ `
            /win32icon:src\Mover.ico /out:bin\Mover.exe src\Mover.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item bin\Mover.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Mover
          path: bin/Mover.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: gh release create "$env:VERSION" bin/Mover.exe --target "${{ github.sha }}" --title "Mover $env:VERSION" --generate-notes
