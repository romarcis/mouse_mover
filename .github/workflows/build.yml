name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compila MouseMover.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ `
            /win32icon:src\MouseMover.ico /out:bin\MouseMover.exe src\MouseMover.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item bin\MouseMover.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: MouseMover
          path: bin/MouseMover.exe

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" bin/MouseMover.exe --title "Mouse Mover ${{ github.ref_name }}" --generate-notes
