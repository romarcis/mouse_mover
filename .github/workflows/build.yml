name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      versione:
        description: 'Versione da pubblicare come release (es. v1.0.0). Vuoto = solo build.'
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compila MouseMover.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /optimize+ `
            /win32icon:src\MouseMover.ico /out:bin\MouseMover.exe src\MouseMover.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item bin\MouseMover.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: MouseMover
          path: bin/MouseMover.exe

      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.versione != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONE: ${{ inputs.versione || github.ref_name }}
        run: gh release create "$env:VERSIONE" bin/MouseMover.exe --target "${{ github.sha }}" --title "Mouse Mover $env:VERSIONE" --generate-notes
